<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'">
<title>Civ Remake</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #e6eaf2; font: 13px -apple-system, "Helvetica Neue", Arial, sans-serif; overflow: hidden; user-select: none; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #overlay { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: #000; text-align: center; padding: 24px; }
  #overlay.hidden { display: none; }
  #overlay h1 { font-size: 20px; margin: 0; }
  #overlay p { max-width: 560px; margin: 0; color: #aab3c5; line-height: 1.5; }
  button { background: #2c3650; color: #e6eaf2; border: 1px solid #44507a; border-radius: 6px; padding: 6px 14px; font: inherit; cursor: pointer; }
  button:hover { background: #38456a; }
</style>
</head>
<body>
<canvas id="screen"></canvas>
<div id="overlay">
  <h1 id="overlayTitle">Loading…</h1>
  <p id="overlayText"></p>
  <button id="overlayButton" hidden>Choose Game Folder…</button>
</div>
<script src="renderer.js"></script>
</body>
</html>
